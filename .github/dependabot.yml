version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: daily
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    # Keep release workflows on main to match Octo STS trust policies.
    ignore:
      - dependency-name: connectbot/actions/.github/workflows/prepare-release.yml
      - dependency-name: connectbot/actions/.github/workflows/publish-release.yml
      - dependency-name: connectbot/actions/.github/workflows/release-branch.yml
